name: ci
on: [push, pull_request]

# Single workflow for both forges: GitHub Actions and Gitea Actions
# (self-hosted runners) use this same file. Stdlib-only project, so the
# system python3 is enough - no setup-python, no pip install.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show interpreter
        run: python3 --version
      - name: Fail on SyntaxWarnings
        run: python3 -W error::SyntaxWarning -c "import cmsmap.main"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cmsmap:test .
      - name: Smoke-test image
        run: docker run --rm cmsmap:test --help
